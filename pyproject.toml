[project]
name = "maclasse-mcp"
version = "0.1.0"
description = "Serveur MCP (non officiel) pour l'espace établissement ecole.maclasse.photo — photos scolaires"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]
fratries = ["insightface>=0.7", "onnxruntime>=1.17", "opencv-python-headless>=4.9", "reportlab>=4", "numpy"]

[project.scripts]
maclasse-mcp = "maclasse_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["maclasse_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
